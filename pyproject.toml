[project]
name = "tont-game"
version = "1.1.0"
description = "Implementação digital do jogo Topa ou Não Topa (CLI)."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
    { name = "André Luiz de Oliveira", email = "andreluoliveira@outlook.com" },
]
dependencies = []

[project.urls]
Repository = "https://github.com/andreluoliveira82/tont-game"

[project.scripts]
tont-game = "tont_game.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tont_game"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
    "taskipy>=1.13",
]

[tool.uv]
# Cache (C:) e projeto (D:) ficam em discos diferentes; hardlink não é
# suportado entre eles. "copy" evita o aviso de fallback do uv.
link-mode = "copy"

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.taskipy.tasks]
test = "pytest"
lint = "ruff check src tests"
format = "ruff format src tests"
run = "python -m tont_game"
check = "ruff format --check src tests && ruff check src tests && pytest"
