<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Topa ou Não Topa</title>
<style>
  :root{
    --bg:#050506; --bg-2:#0c0c10; --ink:#efe9dc; --muted:#8b8578; --faint:#57534a;
    --gold:#e8c877; --gold-deep:#b98c34; --danger:#c9736b;
    --edge:rgba(232,200,119,.16); --ease:cubic-bezier(.2,.7,.2,1);
    font-synthesis:none;-webkit-text-size-adjust:100%;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;overflow:hidden;}
  body{color:var(--ink);
    background:radial-gradient(120% 80% at 50% 6%, #141109 0%, var(--bg-2) 42%, var(--bg) 100%);
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
    letter-spacing:.2px;transition:background 1200ms var(--ease);}
  #glow{position:fixed;inset:0;z-index:1;pointer-events:none;
    background:
      radial-gradient(38% 30% at 50% 36%, rgba(232,200,119,.32) 0%, transparent 70%),
      radial-gradient(66% 54% at 50% 40%, rgba(232,200,119,.10) 0%, transparent 72%);
    opacity:.62;transition:opacity 1200ms var(--ease),filter 1200ms var(--ease);
    animation:glowBreath 9s ease-in-out infinite;}          /* a real spotlight that breathes */
  @keyframes glowBreath{0%,100%{transform:scale(1);}50%{transform:scale(1.06);}}
  #dust{position:fixed;inset:0;z-index:1;pointer-events:none;}
  #fx{position:fixed;inset:0;z-index:7;pointer-events:none;}
  #alert{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:0;
    background:radial-gradient(96% 76% at 50% 45%, rgba(196,44,44,.20), transparent 70%);
    transition:opacity .6s var(--ease);}
  body.call #alert{opacity:1;animation:redPulse 1.5s ease-in-out infinite;}   /* the phone rings in red */
  @keyframes redPulse{0%,100%{opacity:.28;}50%{opacity:.9;}}
  body.tense #glow{opacity:.16;filter:saturate(.6);}
  body.warm #glow{opacity:.62;}
  body.cool #glow{opacity:.12;filter:hue-rotate(195deg) saturate(.5);}
  body.floor #glow{opacity:.07;filter:grayscale(.6);}
  body.apotheosis #glow{opacity:1;filter:saturate(1.2) brightness(1.15);}
  body.cool{background:radial-gradient(120% 80% at 50% 6%, #0d1014, #0b0c0f 45%, var(--bg));}
  body.floor{background:radial-gradient(120% 80% at 50% 6%, #0f0f10, #0a0a0b 45%, var(--bg));}
  body.apotheosis{background:radial-gradient(120% 85% at 50% 4%, #221805, #14100a 42%, var(--bg));}
  body.call #glow{opacity:.05;filter:saturate(.35) brightness(.7);}
  body.call{background:radial-gradient(120% 80% at 50% 6%, #0b0c10, #090a0c 45%, #050506);}
  body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:6;
    background:radial-gradient(150% 105% at 50% 45%, transparent 52%, rgba(0,0,0,.62) 100%);}

  .arena{position:relative;z-index:2;height:100dvh;display:grid;
    grid-template-columns:minmax(86px,152px) minmax(0,1fr) minmax(86px,152px);
    gap:clamp(6px,1.4vw,18px);padding:clamp(8px,2vw,22px);align-items:stretch;}
  .arena.flinch{animation:flinch .5s var(--ease);}
  @keyframes flinch{0%,100%{transform:none;}18%{transform:translate(-5px,2px);}
    44%{transform:translate(5px,-1px);}70%{transform:translate(-3px,1px);}}

  /* value board — the protagonist that hugs the stage */
  .rail{display:flex;flex-direction:column;overflow:hidden;gap:3px;padding:4px 2px;
    font-family:ui-sans-serif,system-ui,sans-serif;font-variant-numeric:tabular-nums;}
  .val{display:flex;align-items:center;justify-content:center;flex:1 1 0;min-height:0;width:100%;
    padding:2px 6px;border-radius:7px;font-size:clamp(.55rem,1.5vw,.82rem);font-weight:600;
    color:#f0e0af;white-space:nowrap;letter-spacing:.01em;
    background:linear-gradient(180deg,rgba(232,200,119,.13),rgba(232,200,119,.03));
    border:1px solid rgba(232,200,119,.22);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 0 9px rgba(232,200,119,.05);
    animation:plaqueSoft 4.6s ease-in-out infinite;
    transition:color .6s var(--ease),background .6s var(--ease),border-color .6s var(--ease),
      box-shadow .6s var(--ease),opacity .6s var(--ease),transform .6s var(--ease);}
  @keyframes plaqueSoft{0%,100%{box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 0 8px rgba(232,200,119,.06);}
    50%{box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 0 15px rgba(232,200,119,.16);}}
  .val.warm{color:#f0dca0;background:linear-gradient(180deg,rgba(232,200,119,.16),rgba(232,200,119,.04));
    border-color:rgba(232,200,119,.28);}
  .val.hot{color:#fff2cf;background:linear-gradient(180deg,rgba(232,200,119,.30),rgba(232,200,119,.09));
    border-color:rgba(232,200,119,.55);animation:plaque 3.6s ease-in-out infinite;}
  @keyframes plaque{0%,100%{box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 0 15px rgba(232,200,119,.22);}
    50%{box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 0 26px rgba(232,200,119,.42);}}
  .val.apex{color:#fff7e0;background:linear-gradient(180deg,rgba(232,200,119,.44),rgba(232,200,119,.13));
    border-color:var(--gold);animation:apexGlow 3s ease-in-out infinite;}
  @keyframes apexGlow{0%,100%{box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 0 20px rgba(232,200,119,.42);transform:scale(1);}
    50%{box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 0 36px rgba(232,200,119,.78);transform:scale(1.03);}}
  .val.dead{color:#524d44;background:rgba(255,255,255,.012);border-color:rgba(255,255,255,.04);
    box-shadow:none;text-decoration:line-through;opacity:.5;animation:none!important;}
  .val.dying{animation:shake .5s var(--ease);}
  @keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-3px);}50%{transform:translateX(3px);}75%{transform:translateX(-2px);}}
  .val.dying.big{color:var(--danger)!important;text-shadow:0 0 18px rgba(201,115,107,.55)!important;
    animation:shakeBig .68s var(--ease);}
  @keyframes shakeBig{0%{transform:translateX(0) scale(1.18);}15%{transform:translateX(-6px);}
    32%{transform:translateX(6px);}50%{transform:translateX(-5px);}68%{transform:translateX(4px);}100%{transform:translateX(0) scale(1);}}

  .stage{min-width:0;display:flex;flex-direction:column;overflow:hidden;}
  .marquee{display:flex;justify-content:space-between;align-items:baseline;color:var(--faint);
    font-size:.7rem;letter-spacing:.26em;text-transform:uppercase;
    font-family:ui-sans-serif,system-ui,sans-serif;min-height:1.2em;}
  .marquee b{color:var(--muted);font-weight:600;}
  .focal{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;
    align-items:center;text-align:center;gap:clamp(10px,2.4vw,22px);overflow:hidden;}
  .kicker{color:var(--muted);font-family:ui-sans-serif,system-ui,sans-serif;font-size:.78rem;
    letter-spacing:.3em;text-transform:uppercase;max-width:30ch;}
  .title{font-size:clamp(1.4rem,4.6vw,2.3rem);line-height:1.15;max-width:16ch;}
  .logo{font-size:clamp(2rem,9vw,4.4rem);line-height:1.04;letter-spacing:.02em;font-weight:600;
    max-width:13ch;text-shadow:0 0 70px rgba(232,200,119,.25);}
  .lead{color:var(--muted);max-width:34ch;font-size:.98rem;line-height:1.55;}
  .amount{font-variant-numeric:tabular-nums;letter-spacing:.01em;}
  .gold{color:var(--gold);} .sober{color:var(--ink);}

  .cases{display:grid;gap:clamp(8px,1.9vw,16px);width:100%;max-width:600px;
    grid-template-columns:repeat(6,1fr);}
  @media(max-width:560px){.cases{grid-template-columns:repeat(5,1fr);}}
  .case{aspect-ratio:5/4;border-radius:12px;position:relative;cursor:pointer;color:#ffe7a6;
    font-variant-numeric:tabular-nums;font-weight:600;font-size:clamp(1.05rem,3.8vw,1.6rem);display:flex;
    align-items:center;justify-content:center;overflow:hidden;
    text-shadow:0 1px 1px rgba(0,0,0,.85),0 0 18px rgba(232,200,119,.55);
    background:
      radial-gradient(120% 80% at 50% 0%, rgba(255,236,180,.22), transparent 60%),
      linear-gradient(180deg,rgba(255,255,255,.18),transparent 24%),
      linear-gradient(to bottom,transparent 46%,rgba(232,200,119,.30) 48%,rgba(0,0,0,.42) 50%,transparent 52%),
      linear-gradient(158deg,#6a5f3f 0%,#41371f 46%,#1e1609 100%);
    border:1px solid rgba(232,200,119,.46);
    box-shadow:inset 0 2px 0 rgba(255,255,255,.22),inset 0 -16px 26px rgba(0,0,0,.5),
      0 12px 28px rgba(0,0,0,.62),0 0 22px rgba(232,200,119,.10);
    transition:transform .26s var(--ease),box-shadow .26s var(--ease),
      border-color .26s var(--ease),opacity .42s var(--ease);-webkit-tap-highlight-color:transparent;}
  .case::before{content:"";position:absolute;left:33%;right:33%;top:8%;height:8px;
    border-radius:8px 8px 3px 3px;background:linear-gradient(180deg,#6a5f3c,#241d10);
    box-shadow:0 1px 0 rgba(232,200,119,.5),inset 0 1px 0 rgba(255,255,255,.3);}
  .case::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.12) 50%,transparent 60%);
    opacity:0;transition:opacity .26s var(--ease);}
  .case:hover{transform:translateY(-6px) scale(1.02);border-color:var(--gold);
    box-shadow:inset 0 2px 0 rgba(255,255,255,.22),inset 0 -16px 26px rgba(0,0,0,.5),
      0 22px 44px rgba(0,0,0,.68),0 0 36px rgba(232,200,119,.3);}
  .case:hover::after{opacity:1;}
  .case:active{transform:translateY(-2px) scale(.99);}
  .case.spent{cursor:default;opacity:.16;filter:saturate(.3);transform:none;box-shadow:none;
    border-color:rgba(255,255,255,.05);text-shadow:none;}
  .case.spent::before,.case.spent::after{opacity:0;}
  .case.mine{border-color:var(--gold);cursor:default;color:#fff6de;
    background:linear-gradient(180deg,rgba(255,255,255,.2),transparent 22%),
      linear-gradient(158deg,#5a4e2c,#2a2313 52%,#141007);
    box-shadow:inset 0 2px 0 rgba(255,255,255,.24),0 0 44px rgba(232,200,119,.4),0 10px 24px rgba(0,0,0,.55);}

  .mycase{display:flex;flex-direction:column;align-items:center;gap:5px;}
  .mycase .seal{min-width:64px;height:54px;padding:0 12px;border-radius:11px;display:flex;
    align-items:center;justify-content:center;font-variant-numeric:tabular-nums;font-size:1.2rem;
    background:linear-gradient(160deg,#26241c,#141209);border:1px solid var(--gold);
    box-shadow:0 0 34px rgba(232,200,119,.22),inset 0 1px 0 rgba(255,255,255,.08);}
  .mycase .tag{color:var(--muted);font-family:ui-sans-serif,system-ui,sans-serif;font-size:.64rem;
    letter-spacing:.26em;text-transform:uppercase;}

  .offer{font-variant-numeric:tabular-nums;font-weight:600;line-height:1;
    font-size:clamp(2.2rem,11vw,5rem);letter-spacing:.005em;max-width:100%;overflow-wrap:anywhere;
    text-shadow:0 0 60px rgba(232,200,119,.28);}
  body.apotheosis .offer{text-shadow:0 0 100px rgba(232,200,119,.6);}
  body.cool .offer,body.floor .offer{text-shadow:none;}
  .offer.win-big{font-size:clamp(3rem,15vw,7rem);}     /* victory overwhelms the screen */

  .choices{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;}
  button.act{appearance:none;cursor:pointer;color:var(--ink);font-family:ui-sans-serif,system-ui,sans-serif;
    letter-spacing:.15em;text-transform:uppercase;font-size:.8rem;padding:13px 24px;border-radius:999px;
    background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));
    border:1px solid var(--edge);transition:all 240ms var(--ease);-webkit-tap-highlight-color:transparent;}
  button.act:hover{border-color:var(--gold);box-shadow:0 0 24px rgba(232,200,119,.18);transform:translateY(-1px);}
  button.act.primary{border-color:var(--gold-deep);color:var(--gold);
    background:linear-gradient(180deg,rgba(232,200,119,.18),rgba(232,200,119,.05));}
  button.act.ghost{opacity:.72;}
  .err{color:var(--danger);font-family:ui-sans-serif,system-ui,sans-serif;font-size:.8rem;
    min-height:1.1em;text-align:center;}
  .ghosts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center;
    opacity:.55;font-family:ui-sans-serif,system-ui,sans-serif;}
  .ghost-label{color:var(--faint);font-size:.62rem;letter-spacing:.24em;text-transform:uppercase;}
  .ghost{font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums;
    border:1px solid rgba(255,255,255,.07);border-radius:999px;padding:4px 11px;
    background:rgba(255,255,255,.02);animation:float 4.2s ease-in-out infinite;}
  @keyframes float{0%,100%{transform:translateY(0);opacity:.55;}50%{transform:translateY(-2px);opacity:.82;}}
  .ghost.peak{color:var(--gold);border-color:rgba(232,200,119,.3);}
  .ghosts.haunt{opacity:.9;}
  .ghosts.haunt .ghost-label{color:var(--danger);}
  .ghosts.haunt .ghost.peak{color:var(--danger);border-color:rgba(201,115,107,.42);
    text-shadow:0 0 13px rgba(201,115,107,.4);}
  .haunt-line{width:100%;color:var(--danger);font-size:clamp(.92rem,3.2vw,1.18rem);
    text-shadow:0 0 16px rgba(201,115,107,.35);}
  .opened{display:flex;flex-direction:column;align-items:center;gap:8px;}
  .opened-num{color:var(--faint);font-family:ui-sans-serif,system-ui,sans-serif;font-size:.68rem;
    letter-spacing:.28em;text-transform:uppercase;}
  .opened-val{font-variant-numeric:tabular-nums;font-weight:600;color:var(--muted);
    font-size:clamp(1.7rem,8vw,3.2rem);}
  .opened-val.bad{color:var(--danger);}
  .curtain{color:var(--faint);font-family:ui-sans-serif,system-ui,sans-serif;font-size:.64rem;
    letter-spacing:.42em;text-transform:uppercase;margin-top:2px;}
  .verdict{font-family:ui-sans-serif,system-ui,sans-serif;font-weight:700;letter-spacing:.2em;
    text-transform:uppercase;font-size:clamp(1rem,4.4vw,1.7rem);}
  .verdict.win{color:var(--gold);text-shadow:0 0 26px rgba(232,200,119,.4);}
  .verdict.lose{color:var(--danger);text-shadow:0 0 22px rgba(201,115,107,.32);}

  .fade-in{animation:fade 520ms var(--ease) both;}
  @keyframes fade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
  .rise{animation:rise 900ms var(--ease) both;}
  @keyframes rise{from{opacity:0;transform:scale(.94);filter:blur(6px);}to{opacity:1;transform:none;filter:blur(0);}}
  .land{animation:land 950ms var(--ease) both;}
  @keyframes land{0%{opacity:0;transform:scale(.82);filter:blur(12px);}55%{opacity:1;filter:blur(0);}100%{transform:scale(1);}}
  .pulse{animation:breath 2.2s ease-in-out infinite;}
  @keyframes breath{0%,100%{opacity:.34;}50%{opacity:.92;}}
  @media(prefers-reduced-motion:reduce){*{animation-duration:1ms!important;transition-duration:1ms!important;}}
</style>
</head>
<body>
<div id="glow"></div>
<div id="alert"></div>
<canvas id="dust"></canvas>
<canvas id="fx"></canvas>
<div class="arena">
  <aside class="rail left" id="railL"></aside>
  <main class="stage">
    <div class="marquee"><span>Topa ou Não Topa</span><span id="hud"></span></div>
    <section id="focal" class="focal"></section>
    <div id="err" class="err"></div>
  </main>
  <aside class="rail right" id="railR"></aside>
</div>

<script>
const BRL=new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"});
const money=(v)=>v==null?"—":BRL.format(Number(v));
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const wait=(ms)=>new Promise(r=>setTimeout(r,ms));
const reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const beat=(ms)=>wait(reduce?Math.min(ms,150):ms);

/* subtle synthesized sound — silence until the first user gesture */
let AC=null;
function ac(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();}catch(e){AC=null;}return AC;}
function tone({freq=440,freq2=null,type="sine",dur=.12,gain=.04,at=.005,delay=0}){
  const c=ac();if(!c)return;const t=c.currentTime+delay;
  const o=c.createOscillator(),g=c.createGain();o.type=type;
  o.frequency.setValueAtTime(freq,t);if(freq2)o.frequency.exponentialRampToValueAtTime(freq2,t+dur);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(gain,t+at);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g).connect(c.destination);o.start(t);o.stop(t+dur+.03);
}
/* studio soundscape: a low room tone + a deep ambient drone, always present, ducking per scene */
let AMB=null;
function ambStart(){
  const c=ac();if(!c||AMB)return;
  const buf=c.createBuffer(1,c.sampleRate*2,c.sampleRate),data=buf.getChannelData(0);
  for(let i=0;i<data.length;i++)data[i]=Math.random()*2-1;
  const noise=c.createBufferSource();noise.buffer=buf;noise.loop=true;
  const lp=c.createBiquadFilter();lp.type="lowpass";lp.frequency.value=380;
  const ng=c.createGain();ng.gain.value=.010;
  noise.connect(lp).connect(ng).connect(c.destination);noise.start();
  const o=c.createOscillator();o.type="sine";o.frequency.value=56;
  const og=c.createGain();og.gain.value=.011;
  o.connect(og).connect(c.destination);o.start();
  AMB={c,ng,og};
}
function ambSet(level,dur){if(!AMB)return;const t=AMB.c.currentTime,d=dur||1.2;
  AMB.ng.gain.linearRampToValueAtTime(.010*level,t+d);
  AMB.og.gain.linearRampToValueAtTime(.011*level,t+d);}
/* the score: a procedural cinematic soundtrack that conducts emotion (not effects) */
const Music=(function(){
  let master=null,active=[],loopTimer=null,current=null;
  function ensure(){const c=ac();if(!c)return null;if(!master){master=c.createGain();master.gain.value=0;master.connect(c.destination);}return c;}
  function clearNotes(rel){const c=ac();if(!c)return;active.forEach(n=>{try{n.g.gain.cancelScheduledValues(c.currentTime);
    n.g.gain.setTargetAtTime(.0001,c.currentTime,rel||.6);n.o.stop(c.currentTime+(rel||.6)*5);}catch(e){}});active=[];}
  function chord(freqs,type,gain){const c=ac();if(!c||!master)return;freqs.forEach(f=>{const o=c.createOscillator(),g=c.createGain();
    o.type=type||"triangle";o.frequency.value=f;g.gain.setValueAtTime(.0001,c.currentTime);
    g.gain.exponentialRampToValueAtTime(gain,c.currentTime+1.3);o.connect(g).connect(master);o.start();active.push({o,g});});}
  const SETS={choose:[[131,165,196],[147,175,220]],play:[[131,165,196],[123,155,185],[147,175,220],[110,138,165]]};
  function startTheme(name,vol){const c=ensure();if(!c)return;if(current===name&&loopTimer)return;
    if(loopTimer){clearInterval(loopTimer);loopTimer=null;}clearNotes(1);current=name;
    master.gain.setTargetAtTime(vol,c.currentTime,.9);let i=0;const set=SETS[name]||SETS.choose;
    const play=()=>{clearNotes(2.2);chord(set[i%set.length],"triangle",.085);i++;};play();loopTimer=setInterval(play,6200);}
  function stopTheme(rel){if(loopTimer){clearInterval(loopTimer);loopTimer=null;}current=null;clearNotes(rel==null?1:rel);
    const c=ac();if(c&&master)master.gain.setTargetAtTime(0,c.currentTime,.5);}
  return{
    play(){startTheme("play",.5);},
    silence(){stopTheme(.4);},                                   /* the phone: the music stops */
    sustain(){const c=ensure();if(!c)return;stopTheme(.15);current="sustain";
      master.gain.setTargetAtTime(.5,c.currentTime,.3);chord([196,262],"sine",.055);},   /* a held, tense note */
    victory(){const c=ensure();if(!c)return;stopTheme(.1);current="win";master.gain.setTargetAtTime(1,c.currentTime,.2);
      [[262,330,392],[349,440,523],[392,494,587],[523,659,784]].forEach((ch,k)=>setTimeout(()=>{clearNotes(.9);chord(ch,"triangle",.11);},k*640));},
    tragedy(){const c=ensure();if(!c)return;stopTheme(.1);current="loss";master.gain.setTargetAtTime(.7,c.currentTime,.6);
      chord([98,117,147],"sine",.08);setTimeout(()=>{clearNotes(1.6);chord([87,104,131],"sine",.075);},1500);},
  };
})();
const S={
  click(){ambStart();tone({freq:1700,type:"square",dur:.045,gain:.02});tone({freq:520,type:"triangle",dur:.09,gain:.02});},
  open(value,max){                                   /* the sound narrates the magnitude */
    const b=Math.min(1,value/(max||1));
    if(b<0.03){tone({freq:1000,freq2:1500,type:"sine",dur:.13,gain:.03});}          /* relief chirp */
    else if(b<0.15){tone({freq:760,freq2:920,type:"triangle",dur:.14,gain:.03});}
    else if(b<0.45){tone({freq:420,type:"triangle",dur:.18,gain:.035});}
    else if(b<0.8){tone({freq:260,freq2:170,type:"sawtooth",dur:.34,gain:.045});}
    else{                                                                            /* a big one — pain */
      tone({freq:150,freq2:64,type:"sawtooth",dur:.62,gain:.06});
      tone({freq:92,type:"sine",dur:.82,gain:.055,delay:.03});
      tone({freq:210,type:"square",dur:.28,gain:.02,delay:.02});
    }
  },
  phone(){tone({freq:480,type:"sine",dur:.16,gain:.028});tone({freq:640,type:"sine",dur:.16,gain:.028,delay:.24});},
  land(){tone({freq:170,freq2:85,type:"sine",dur:.6,gain:.06});tone({freq:760,type:"sine",dur:.22,gain:.025});},
  win(){tone({freq:523,type:"sine",dur:.5,gain:.05});tone({freq:784,type:"sine",dur:.6,gain:.05,delay:.12});},
  triumph(){[523,659,784,1047].forEach((f,i)=>tone({freq:f,type:"sine",dur:.6,gain:.05,delay:i*.13}));},
  loss(){tone({freq:300,freq2:150,type:"sine",dur:.7,gain:.045});tone({freq:110,type:"sine",dur:.9,gain:.04,delay:.05});},
};

let sessionId=null, prevStatus=null, railBuilt=false, refused=[];
const valNodes=new Map();
const railL=document.getElementById("railL"),railR=document.getElementById("railR");
const focal=document.getElementById("focal"),hud=document.getElementById("hud"),errBox=document.getElementById("err");

async function post(p,d){const r=await fetch(p,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(d||{})});return r.json();}
async function start(){document.body.className="";railBuilt=false;refused=[];railL.innerHTML="";railR.innerHTML="";valNodes.clear();ambSet(1,.6);Music.silence();
  const d=await post("/api/start",{});sessionId=d.session_id;prevStatus=null;
  await intro();render(d.view);}
async function intro(){
  setMood(null);focal.innerHTML="";
  focal.appendChild(el("div","logo rise","Topa <span class='gold'>ou não</span> Topa"));
  await beat(1700);
  focal.appendChild(el("div","kicker fade-in","uma decisão pode valer tudo"));
  await beat(1300);
}
async function act(a,p){const d=await post("/api/act",{session_id:sessionId,action:a,params:p||{}});render(d.view);}
let busy=false;
async function openCase(n){
  if(busy)return;busy=true;S.click();
  try{
    const d=await post("/api/act",{session_id:sessionId,action:"open_briefcase",params:{number:n}});
    const view=d.view,opened=view.opened_briefcases.find(o=>o.number===n);
    updateRails(view);                                   /* the value dies in the rail */
    if(opened){
      const max=Math.max(...allValues(view)),val=Number(opened.value),isHigh=val>=max*0.5;
      killValue(opened.value,isHigh,val===max);          /* the stage flinches for the top prize */
      await revealOpened(n,opened.value,max);
    }
    render(view);                                        /* settle: next open, or the offer */
  }finally{busy=false;}
}
async function revealOpened(n,value,max){
  S.open(Number(value),max);
  focal.innerHTML="";
  const box=el("div","opened land");
  box.appendChild(el("div","opened-num","maleta "+n));
  box.appendChild(el("div","opened-val amount"+(Number(value)>=max*0.5?" bad":""),money(value)));
  focal.appendChild(box);
  await beat(760);                                       /* the weight of the revelation */
}

function allValues(view){
  const alive=view.remaining_values.map(Number);
  const dead=view.opened_briefcases.map(o=>Number(o.value));
  return [...alive,...dead];
}
function buildRails(view){
  railL.innerHTML="";railR.innerHTML="";valNodes.clear();
  const asc=allValues(view).sort((a,b)=>a-b),max=asc[asc.length-1]||0;
  const mk=(v)=>{const n=el("div","val",money(v));
    if(v>=max*0.5)n.classList.add("hot");else if(v>=max*0.1)n.classList.add("warm");
    if(v===max)n.classList.add("apex");        /* the top dream glimmers */
    n.style.animationDelay=(Math.random()*4).toFixed(2)+"s";   /* varied, staggered shimmer */
    valNodes.set(v,n);return n;};
  const half=Math.ceil(asc.length/2);
  asc.slice(0,half).forEach(v=>railL.appendChild(mk(v)));   /* menores, crescente */
  asc.slice(half).forEach(v=>railR.appendChild(mk(v)));     /* maiores, crescente */
  railBuilt=true;
}
function updateRails(view){
  if(!railBuilt)buildRails(view);
  const dead=new Set(view.opened_briefcases.map(o=>Number(o.value)));
  valNodes.forEach((node,v)=>{const d=dead.has(v);node.classList.toggle("dead",d);if(d)node.classList.remove("apex");});
}
function killValue(value,isHigh,isApex){
  const node=valNodes.get(Number(value));if(!node)return;
  node.classList.add("dying");if(isHigh)node.classList.add("big");
  setTimeout(()=>node.classList.remove("dying","big"),isHigh?700:520);
  if(isApex){const a=document.querySelector(".arena");a.classList.add("flinch");
    setTimeout(()=>a.classList.remove("flinch"),520);
    const b=node.getBoundingClientRect();FX.shatter(b.left+b.width/2,b.top+b.height/2);} /* the top prize shatters */
}

function myCaseEl(view,reveal){
  const p=view.player_briefcase;if(!p)return null;
  const w=el("div","mycase");
  w.appendChild(el("div","seal","#"+p.number));      /* never crams money — no overflow */
  w.appendChild(el("div","tag",reveal?"a sua maleta":"a sua maleta"));
  return w;
}
function setHud(view){
  if(view.status==="NOT_STARTED"){hud.innerHTML="";return;}
  const p=view.player_briefcase;hud.innerHTML=`Rodada <b>${view.current_round}</b> · sua maleta <b>#${p?p.number:"—"}</b>`;
}
function setMood(m){document.body.classList.remove("tense","warm","cool","floor","apotheosis");if(m)document.body.classList.add(m);}

function sceneChoose(view){
  setMood(null);focal.innerHTML="";
  focal.append(el("div","kicker","bem-vindo"),
    el("div","title","Escolha a maleta que será <span class='gold'>sua</span>."),
    el("div","lead","Ela ficará protegida até o fim. Ninguém sabe o que há dentro — nem você."));
  const grid=el("div","cases rise");
  for(let n=1;n<=26;n++){const c=el("div","case",String(n));c.onclick=()=>{S.click();act("select_briefcase",{number:n});};grid.appendChild(c);}
  focal.appendChild(grid);
}
function sceneHunt(view){
  setMood(null);focal.innerHTML="";
  const mine=myCaseEl(view,false);if(mine)focal.appendChild(mine);
  focal.append(el("div","kicker","abra uma maleta"),
    el("div","lead",`Restam <b class='gold'>${view.openings_remaining}</b> nesta rodada.`));
  const grid=el("div","cases fade-in"),open=new Set(view.available_briefcases);
  for(let n=1;n<=26;n++){
    const isMine=view.player_briefcase&&view.player_briefcase.number===n;
    if(open.has(n)){const c=el("div","case",String(n));c.onclick=()=>openCase(n);grid.appendChild(c);}
    else grid.appendChild(el("div","case "+(isMine?"mine":"spent"),isMine?"★":""));
  }
  focal.appendChild(grid);
}
function sceneEndgame(view){
  setMood("tense");focal.innerHTML="";
  const mine=myCaseEl(view,false);if(mine)focal.appendChild(mine);
  focal.append(el("div","kicker","restam duas maletas"),
    el("div","title","Ficar com a sua… ou <span class='gold'>trocar</span>?"));
  const row=el("div","choices fade-in");
  const t=el("button","act primary","Trocar");t.onclick=()=>{S.click();act("decide_swap",{swap:true});};
  const m=el("button","act","Manter");m.onclick=()=>{S.click();act("decide_swap",{swap:false});};
  row.append(t,m);focal.appendChild(row);
}

function buildOffer(view,animate){
  setMood(null);if(animate){S.land();Music.sustain();}focal.innerHTML="";
  focal.append(el("div","kicker","a oferta do banqueiro"),
    el("div","offer amount gold "+(animate?"land":"fade-in"),money(view.current_offer)),
    el("div","lead"+(animate?" fade-in":""),"Vale a certeza… ou você acredita na sua maleta?"));
  const row=el("div","choices"+(animate?" fade-in":""));
  const topa=el("button","act primary","Topa");
  topa.onclick=()=>{S.click();act("decide",{accept:true});};
  const nao=el("button","act ghost","Não topa");
  nao.onclick=()=>{S.click();refused.push(Number(view.current_offer));act("decide",{accept:false});};
  row.append(topa,nao);focal.appendChild(row);
  if(refused.length)focal.appendChild(ghostsEl(view));
}
function ghostsEl(view){
  const cur=Number(view.current_offer),maxRef=Math.max(...refused),shrinking=cur<maxRef;
  const wrap=el("div","ghosts fade-in"+(shrinking?" haunt":""));
  if(shrinking)wrap.appendChild(el("div","haunt-line","você já teve "+money(maxRef)+" na mão…"));
  else wrap.appendChild(el("div","ghost-label","você já recusou"));
  refused.forEach(v=>wrap.appendChild(el("div","ghost"+(v===maxRef?" peak":""),money(v))));
  return wrap;
}
const BANKER_POOL=[["ele olha para o painel…",1400],["ele olha para a sua maleta…",1400],
  ["ele sorri…",1150],["ele escuta… e não responde…",1650],["o estúdio inteiro espera…",1500],
  ["ele não tem pressa…",1400],["mais silêncio…",1500],["ele percebeu algo…",1450],
  ["o telefone continua mudo…",1550]];
function pickN(a,n){const pool=[...a],out=[];while(out.length<n&&pool.length)out.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);return out;}
function bankerScript(r){const n=r<=3?1:r<=6?2:3;
  return [["o telefone toca…",1300],...pickN(BANKER_POOL,n).map(([t,m])=>[t,m+r*80])];}
async function sayLine(text,ms){focal.innerHTML="";focal.appendChild(el("div","kicker pulse",text));await beat(ms);}
async function playOffer(view){
  const r=view.current_round;                              /* tension rises with the round */
  document.body.classList.add("call");ambSet(.28,.7);Music.silence();S.phone();  /* music stops; the phone rings */
  for(const[text,ms]of bankerScript(r))await sayLine(text,ms);
  focal.innerHTML="";await beat(700+r*160);                /* an uncomfortable silence — did it break? */
  await sayLine("a proposta do Banqueiro…",1200);
  focal.innerHTML="";await beat(480);
  document.body.classList.remove("call");ambSet(1,1.4);    /* the lights return */
  setMood(null);buildOffer(view,true);                     /* only then: the number lands */
}

function revealStory(view){
  /* judges the STORY of the match, not the money alone (calibrated to real examples) */
  const r=view.official_result,got=Number(r.amount_received),own=Number(r.player_briefcase_value);
  const all=allValues(view),mx=Math.max(...all),mn=Math.min(...all);
  const maxRef=refused.length?Math.max(...refused):0;      /* the biggest offer he passed up */
  const gambled=r.ending_type!=="OFFER_ACCEPTED";          /* did he risk it to the end? */
  const swapped=r.swap_decision===true;
  if(got===mx)return{mood:"apotheosis",gold:true,tag:"vitória milionária",
    head:"O MAIOR prêmio da mesa. Você chegou ao topo — não dá pra fazer melhor."};
  if(got===mn)return{mood:"floor",gold:false,tag:"o fundo da mesa",
    head:"O menor prêmio de todos. A sorte virou as costas — mas você foi até o fim."};
  if(maxRef>=got*3)return{mood:"floor",gold:false,tag:"que tragédia",
    head:`Você recusou ${money(maxRef)}… e terminou com ${money(got)}. A ganância cobrou caro.`};
  if(gambled&&maxRef>0&&got>=maxRef*1.4&&got>=own)return{mood:"apotheosis",gold:true,tag:"que coragem",
    head:`Você recusou tudo, arriscou até o fim — e saiu com ${money(got)}. Brilhante.`};
  if(gambled&&swapped&&got>own*1.3)return{mood:"warm",gold:true,tag:"que troca!",
    head:`Você trocou no fim, e a coragem valeu: ${money(got)}.`};
  if(gambled&&swapped&&got<own*0.6)return{mood:"cool",gold:false,tag:"a troca doeu",
    head:`Você trocou… e deixou ${money(own)} para trás. Fica o aprendizado.`};
  if(!gambled&&own>=got*2.5)return{mood:"cool",gold:false,tag:"o banqueiro venceu",
    head:`Você aceitou ${money(got)}, mas a sua maleta escondia ${money(own)}. Ele te convenceu a sair cedo.`};
  if(maxRef>=got*1.8)return{mood:"cool",gold:false,tag:"faltou pouco",
    head:`Já teve ${money(maxRef)} na mão e levou ${money(got)}. Por pouco.`};
  if(!gambled&&got>=own*0.85)return{mood:"warm",gold:true,tag:"decisão sábia",
    head:`Você saiu na hora certa com ${money(got)}. Cabeça fria, boa partida.`};
  if(gambled&&got>=own)return{mood:"warm",gold:true,tag:"você confiou",
    head:`Você confiou na sua maleta até o fim e levou ${money(got)}.`};
  return{mood:"warm",gold:true,tag:"boa partida",head:`Uma partida e tanto — você levou ${money(got)}.`};
}
function revealControls(view){
  const row=el("div","choices fade-in");
  if(view.available_actions.includes("simulate")){const b=el("button","act","Ver o que teria acontecido");b.onclick=()=>{S.click();act("simulate",{});};row.appendChild(b);}
  const again=el("button","act ghost","Jogar de novo");again.onclick=()=>{S.click();start();};row.appendChild(again);
  return row;
}
async function buildReveal(view,animate){
  const r=view.official_result,m=revealStory(view),win=(m.mood==="apotheosis"||m.mood==="warm");
  if(animate){                                   /* the held breath before the truth */
    setMood("tense");ambSet(.5,.8);focal.innerHTML="";
    focal.appendChild(el("div","kicker pulse","o momento da verdade…"));
    await beat(win?2200:2700);                   /* tragedy waits longer, colder */
  }
  setMood(m.mood);                               /* two different universes */
  if(animate){
    if(win){ambSet(1.9,1.6);Music.victory();(m.mood==="apotheosis"?S.triumph():S.win());FX.confetti(m.mood==="apotheosis"?180:70);}
    else{ambSet(.10,2.4);Music.tragedy();S.loss();}    /* the stage goes cold and quiet */
  }
  focal.innerHTML="";
  const mine=myCaseEl(view,true);if(mine)focal.appendChild(mine);
  focal.append(el("div","kicker","você levou"),
    el("div","offer amount "+(m.gold?"gold":"sober")+(win?" win-big":"")+" "+(animate?"land":"fade-in"),money(r.amount_received)));
  if(animate)await beat(win?1500:1300);
  focal.appendChild(el("div","verdict "+(m.gold?"win":"lose")+(animate?" fade-in":""),m.tag));
  if(animate)await beat(win?800:950);
  focal.appendChild(el("div","lead"+(animate?" fade-in":""),m.head));   /* the honest story */
  if(animate)await beat(900);
  focal.appendChild(el("div","lead"+(animate?" fade-in":""),`A sua maleta guardava ${money(r.player_briefcase_value)}.`));
  if(view.simulation){const s=view.simulation;
    if(animate)await beat(750);
    focal.appendChild(el("div","lead fade-in",
      `Se tivesse seguido: ${money(s.hypothetical)} — ${s.hypothetical_is_higher?"teria ganhado mais.":"você fez bem em aceitar."}`));}
  if(animate)await beat(win?1500:1200);          /* time to feel it before the controls */
  focal.appendChild(el("div","curtain fade-in","— fim de jogo —"));
  focal.appendChild(revealControls(view));
}

async function render(view){
  errBox.textContent=view.error||"";setHud(view);updateRails(view);
  const s=view.status,was=prevStatus;
  if(s==="OFFER_PENDING") was!=="OFFER_PENDING"?await playOffer(view):buildOffer(view,false);
  else if(s==="ACCEPTED"||s==="FINISHED") (was==="ACCEPTED"||was==="FINISHED")?buildReveal(view,false):await buildReveal(view,true);
  else if(s==="NOT_STARTED") sceneChoose(view);
  else if(s==="IN_PROGRESS"){Music.play();sceneHunt(view);}
  else sceneEndgame(view);
  prevStatus=s;
}
/* particle FX: confetti for victory, a golden shatter when the top prize dies */
const FX=(function(){
  const cv=document.getElementById("fx"),cx=cv.getContext("2d");let W,H,ps=[],running=false;
  function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight;}addEventListener("resize",resize);resize();
  function loop(){cx.clearRect(0,0,W,H);let alive=false;
    for(const p of ps){if(p.age>=p.life)continue;alive=true;p.age+=.016;p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;
      const k=Math.max(0,1-p.age/p.life);cx.save();cx.globalAlpha=k;cx.fillStyle=p.col;
      if(p.flat){cx.translate(p.x,p.y);cx.rotate(p.rot);cx.fillRect(-p.r,-p.r*.4,p.r*2,p.r*.8);}
      else{cx.beginPath();cx.arc(p.x,p.y,p.r*k,0,6.29);cx.fill();}cx.restore();}
    if(alive)requestAnimationFrame(loop);else{running=false;cx.clearRect(0,0,W,H);}}
  function go(){if(!running){running=true;requestAnimationFrame(loop);}}
  return{
    confetti(count){if(reduce)return;for(let i=0;i<count;i++)setTimeout(()=>{
      ps.push({x:Math.random()*W,y:-12,vx:(Math.random()-.5)*1.6,vy:1+Math.random()*1.6,g:.05,
        r:3+Math.random()*3,life:3.4,age:0,rot:Math.random()*6.28,vr:(Math.random()-.5)*.3,flat:true,
        col:Math.random()<.72?"#e8c877":"#fff2cf"});go();},Math.random()*1100);},
    shatter(x,y){if(reduce)return;for(let i=0;i<24;i++){const a=Math.random()*6.28,sp=2+Math.random()*4;
      ps.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-1,g:.12,r:2+Math.random()*2,life:.9,age:0,rot:0,vr:0,flat:false,col:"#e8c877"});}go();},
  };
})();

/* the living stage: golden dust drifting, always alive */
(function dust(){
  const cv=document.getElementById("dust"),cx=cv.getContext("2d");let W,H,parts=[];
  function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight;
    const n=Math.min(48,Math.round(W*H/40000));
    parts=Array.from({length:n},()=>({x:Math.random()*W,y:Math.random()*H,
      r:Math.random()*1.6+.4,s:Math.random()*.24+.05,a:Math.random()*.4+.1,tw:Math.random()*6.28}));}
  addEventListener("resize",resize);resize();
  function draw(t){cx.clearRect(0,0,W,H);
    for(const p of parts){p.y-=p.s;p.x+=Math.sin(t/3000+p.tw)*.14;if(p.y<-4){p.y=H+4;p.x=Math.random()*W;}
      const tw=.6+.4*Math.sin(t/1200+p.tw);
      cx.beginPath();cx.arc(p.x,p.y,p.r,0,6.29);
      cx.fillStyle="rgba(232,200,119,"+(p.a*tw*.5).toFixed(3)+")";cx.fill();}}
  if(reduce){draw(0);}else{(function loop(t){draw(t);requestAnimationFrame(loop);})(0);}
})();

start();
</script>
